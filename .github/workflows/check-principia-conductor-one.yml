name: Check the conductor-one reduction on Linux

on:
  push:
    branches:
      - checks/principia-ordinary-516b950
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conductor-one:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      LEAN_ABORT_ON_PANIC: "1"
      LEAN_NUM_THREADS: "2"
      MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@v4
        with:
          ref: 516b9507b0208f92dc7e4fbdde8998c58995d041
          persist-credentials: false
      - name: Install the pinned toolchain and Mathlib
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake --version
          lake exe mathlib/cache get
      - name: Restore the verified import closure of the reviewed Lean file
        shell: python
        run: |
          from pathlib import Path
          import concurrent.futures
          import importlib.util
          import json
          import re
          import subprocess

          root=Path.cwd()
          cache=root/".lake/cache"
          dest=cache/"artifacts"
          dest.mkdir(parents=True,exist_ok=True)
          spec=importlib.util.spec_from_file_location("restore",root/"scripts/restore-cache.py")
          restore=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(restore)
          restore.check_project(root)
          def imports(path):
              return re.findall(r"(?m)^\s*(?:public\s+)?import\s+([^\s]+)",path.read_text(encoding="utf-8"))
          reached=set()
          queue=imports(root/"verification/OrdinaryRH.lean")
          while queue:
              name=queue.pop()
              if name in reached or name.split(".")[0] in {"Mathlib","Std","Lean","Init","Lake"}: continue
              src=root/"src"/(name.replace(".","/")+".lean")
              if not src.is_file():
                  raise RuntimeError(f"Missing upstream module {name}")
              reached.add(name)
              queue.extend(imports(src))
          assert len(reached)==3857,len(reached)
          manifest=subprocess.check_output(["curl","-fsSL","--retry","3",restore.URL])
          rows=[row for row in restore.manifest_rows(manifest) if row[0] in reached]
          assert len(rows)==len(reached),(len(rows),len(reached))
          def fetch(row):
              name,_,artifact,digest=row
              file=dest/artifact
              if not file.exists():
                  url="https://rh-cache.taucetiproject.org/artifacts/leanprover-community/riemann-hypothesis/"+artifact[:-5]+".art"
                  subprocess.run(["curl","-fsSL","--retry","3","-o",str(file),url],check=True)
              assert restore.sha256(file)==digest,name
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
              for _ in pool.map(fetch,rows): pass
          jobs=restore.restore_jobs(root,cache,rows)
          for job in jobs:
              for base in job["base"]: Path(base).mkdir(parents=True,exist_ok=True)
          leantar=Path(subprocess.check_output(["elan","which","lean"],text=True).strip()).with_name("leantar")
          subprocess.run([str(leantar),"--jobs","4","-f","-x","-j","-"],input=json.dumps(jobs),text=True,check=True)
          print(f"Restored and SHA-256 checked {len(rows)} archive modules")
      - name: Compile the 552-line proof and audit its five declarations
        run: |
          set -o pipefail
          echo 'e2bab4de455929689f2977514ae8a84b8004fbbbb19619cf7b6866d77c93d33e  verification/OrdinaryRH.lean' | sha256sum -c -
          lake env lean -j1 verification/OrdinaryRH.lean | tee "$RUNNER_TEMP/ordinary-rh.log"
          python3 - "$RUNNER_TEMP/ordinary-rh.log" <<'PY'
          import pathlib,re,sys
          names=re.findall(r"(?m)^#print axioms (\S+)",pathlib.Path("verification/OrdinaryRH.lean").read_text())
          report=pathlib.Path(sys.argv[1]).read_text()
          assert len(names)==5 and "sorryAx" not in report
          for n in names:
              assert f"'{n}' depends on axioms: [propext, Classical.choice, Quot.sound]" in report,n
          PY
