name: Check the signed signal on Linux

on:
  push:
    branches:
      - checks/principia-signed-9430017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-signal:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEAN_ABORT_ON_PANIC: "1"
      LEAN_NUM_THREADS: "2"
      MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
    steps:
      - name: Check out the exact pull request commit
        uses: actions/checkout@v4
        with:
          ref: 9430017510358b5ed1ab12c8bb900fd706e60a32
          persist-credentials: false
      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore the pinned Mathlib
        run: |
          lake --version
          lake exe mathlib/cache get
      - name: Build the certificate's 41 upstream dependencies from source
        run: lake build +Formalism.SizeWindowBrackets.ChainSlopeWindows.LipschitzWeightAndMinimum
      - name: Check the submitted file and report its axioms
        run: |
          set -o pipefail
          lake env lean verification/SignedSignal.lean | tee "$RUNNER_TEMP/signed-signal.log"
          test "$(grep -c 'depends on axioms' "$RUNNER_TEMP/signed-signal.log")" = 3
          if grep -q sorryAx "$RUNNER_TEMP/signed-signal.log"; then exit 1; fi
